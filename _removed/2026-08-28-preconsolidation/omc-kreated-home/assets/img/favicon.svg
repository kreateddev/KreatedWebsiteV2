<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 400 400">
  <!-- KREATED mark, favicon crop.
       Geometry is byte-identical to assets/img/kreated-mark.svg and to the
       three inline hero instances — no redraw, only a tighter viewBox so the
       mark still reads at 16px (measured bbox 134.6,117.3 331x365.8; this box
       is 400x400 centred on it, leaving the mark at ~91% of the height).

       Each of the two paths carries its OWN left-to-right gradient in
       objectBoundingBox units. That is what produces the supplied artwork:
       the left chevron runs pale -> saturated into its inner point, and the
       K runs pale at the vertical stem -> saturated at the arm tips, so the
       stem stays light where the chevron's point is darkest. -->
  <defs>
    <linearGradient id="kg1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2DFF6"/>
      <stop offset="0.52" stop-color="#3D9BDA"/>
      <stop offset="1" stop-color="#0B74BE"/>
    </linearGradient>
    <linearGradient id="kg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2DFF6"/>
      <stop offset="0.52" stop-color="#3D9BDA"/>
      <stop offset="1" stop-color="#0B74BE"/>
    </linearGradient>
  </defs>
