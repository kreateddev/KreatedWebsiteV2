# Netlify configuration — Kreated V2 homepage prototype.
# NOT DEPLOYED. This exists so connecting the site is a one-step operation.
#
# There is no build step: the site is plain HTML/CSS/JS, so `publish` is the
# folder itself and `command` is intentionally empty. Netlify's form detection
# parses the deployed HTML at deploy time, which is why both forms carry
# data-netlify + a hidden form-name input in the static markup rather than
# being registered by script.

[build]
  publish = "."
  command = ""

# Pretty URLs already resolve as directories (/free-website-audit/, /thanks/),
# so no redirect rules are required. No SPA fallback: this is a static site and
# a real 404 should stay a 404.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Long-cache the fingerprinted static assets; never cache the HTML.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
