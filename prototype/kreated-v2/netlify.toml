# Netlify configuration — Kreated V2.
#
# There is no build step: the site is plain HTML/CSS/JS, so `publish` is the
# folder itself and `command` is intentionally empty. Netlify's form detection
# parses the deployed HTML at deploy time, which is why both forms carry
# data-netlify + a hidden form-name input in the static markup rather than
# being registered by script.

[build]
  publish = "."
  command = ""

# ⚠ The audit endpoint. Node 20 for fetch(), AbortSignal.timeout() and the
# structured clone the handler relies on.
#
# The FUNCTIONS have exactly one dependency — @netlify/blobs, declared in
# package.json — which Netlify installs from the base directory before
# bundling. The SITE still has none: no build step, no client-side packages,
# `command` stays empty and `publish` is the source folder.
[functions]
  directory = "netlify/functions"
  # ⚠ esbuild, so the require('@netlify/blobs') in netlify/functions/lib/
  # rate-limit.js is resolved and bundled into the function. This is also what
  # makes the dependency visible to Netlify, which is what triggers it to
  # inject the Blobs credentials the store needs.
  # 🚫 The only valid values are esbuild and zisi. "none" is not one — it was
  # set to that once and the deploy failed rather than being ignored.
  node_bundler = "esbuild"
  # History, because this key has already broken one deploy: it was `"none"`,
  # which is not a valid value, and the deploy FAILED rather than ignoring it.
  # It was then left unset (= zisi) while the functions had no dependencies.
  # Now @netlify/blobs is a dependency and esbuild is required.

# ⚠ NO [functions."audit"] timeout KEY. It was `timeout = 26`, which is not a
# supported netlify.toml property; function timeout is a site setting in the
# Netlify UI. The function therefore has to fit inside whatever the site's
# timeout is, and the default is 10s — so the budget in netlify/functions/
# audit.js is sized for 10s, not 26s. If the site timeout is raised later, the
# budget can be raised with it. 🚫 Do not put the key back and assume it works.

# ⚠ NO [edge_functions] BLOCK. The rate-limit edge function declares its own
# path in its exported `config`, and Netlify auto-discovers files in
# netlify/edge-functions/. Declaring it here as well is a second, competing
# declaration of the same function.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Long-cache the fingerprinted static assets; never cache the HTML.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
