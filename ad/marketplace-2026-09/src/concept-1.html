<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kreated — Marketplace ad, concept 1 (editorial)</title>
<!-- ==========================================================================
     CONCEPT 1 — EDITORIAL / QUIET LUXURY
     The argument: every other website ad on Marketplace is loud, so the one
     that behaves like a magazine spread is the one that looks expensive.
     Paper ground, navy ink, one cobalt object, enormous negative space, and
     the portfolio entering from the bottom-right corner as if the page
     continues past the frame.
     Risk being tested: does restraint survive a 160px thumbnail?
     ========================================================================== -->
<link rel="stylesheet" href="kit.css">
<style>
  .canvas{background:var(--paper);color:var(--navy)}

  /* ---- masthead ---------------------------------------------------------- */
  .c1-head{
    position:absolute;left:72px;right:72px;top:66px;
    display:flex;align-items:baseline;justify-content:space-between;
  }
  .c1-head .mark{font-size:27px;color:var(--navy)}
  .c1-head .eyebrow{font-size:13px;letter-spacing:.24em;color:#5A6488}
  .c1-rule{position:absolute;left:72px;right:72px;top:112px;height:1px;background:rgba(2,12,46,.16)}

  /* ---- the statement ----------------------------------------------------- */
  .c1-say{position:absolute;left:72px;top:168px;width:940px}
  .c1-say .headline{font-size:94px;color:var(--navy)}
  .c1-say .headline em{color:var(--cobalt)}

  .c1-sub{
    position:absolute;left:72px;top:452px;
    font-size:27px;font-weight:400;letter-spacing:-.006em;color:#3D4666;
  }

  /* The price is editorial furniture, not a sticker: the qualifier in the
     sans at label size, the figure in the serif at display size, sharing a
     baseline. A boxed "$700" badge is exactly the move that makes an ad look
     like the $299 listings this one has to beat. */
  .c1-price{position:absolute;left:72px;top:536px;display:flex;align-items:baseline;gap:20px}
  .c1-price__k{font-size:13px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:#5A6488}
  .c1-price__v{
    font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;
    font-size:62px;line-height:1;color:var(--navy);
  }

  .c1-cta{
    position:absolute;left:72px;top:640px;
    font-size:19px;font-weight:600;letter-spacing:.04em;color:var(--navy);
    border-bottom:2px solid var(--cobalt);padding-bottom:9px;
  }

  /* ---- the portfolio band -----------------------------------------------
     A single horizontal band across the foot, bleeding off both sides and
     the bottom so the row reads as a continuing shelf rather than three
     objects that happen to have been placed.

     Z RISES LEFT TO RIGHT and that is the whole reason the row is legible:
     every one of the three sites puts its logo and its headline in the left
     half of the hero, so each window that is partly covered is covered on
     the side that carries the least information. The rightmost window is the
     only complete one, so it is the strongest of the three shots.
     🚫 Do not put the front window in the middle. It reads as a nicer fan
     and it buries two headlines. */
  .c1-work{position:absolute;left:0;top:0;width:1080px;height:1080px}
  .c1-work .win{position:absolute;width:500px}
  .c1-work .win--a{left:-55px;top:762px;z-index:1}
  .c1-work .win--b{left:300px;top:736px;z-index:2}
  .c1-work .win--c{left:655px;top:710px;z-index:3}
  /* on paper the window needs a dark hairline or it dissolves into the ground */
  .c1-work .win::after{box-shadow:inset 0 0 0 1px rgba(2,12,46,.22)}
  .c1-work .win{box-shadow:0 2px 5px rgba(2,12,46,.10),0 20px 44px rgba(2,12,46,.16),0 60px 120px rgba(2,12,46,.18)}
</style>
</head>
<body>
<div class="canvas canvas--1x1">

  <div class="c1-head">
    <div class="mark">KREATED</div>
    <div class="eyebrow">Raleigh · Wilmington · NC</div>
  </div>
  <div class="c1-rule"></div>

  <div class="c1-say">
    <h1 class="headline">Your website<br>should bring you<br><em>customers.</em></h1>
  </div>

  <p class="c1-sub">Web design and local SEO, built for growth.</p>

  <div class="c1-price">
    <div class="c1-price__k">Starting at</div>
    <div class="c1-price__v">$700</div>
  </div>

  <div class="c1-cta">MESSAGE US ABOUT YOUR BUSINESS</div>

  <div class="c1-work">
    <div class="win win--a">
      <div class="win__bar"><i class="win__dot"></i><i class="win__dot"></i><i class="win__dot"></i>
        <span class="win__url">rareraleighrestoration.com</span></div>
      <img class="win__shot" src="shots/rare-raleigh.jpg" alt="">
    </div>
    <div class="win win--b">
      <div class="win__bar"><i class="win__dot"></i><i class="win__dot"></i><i class="win__dot"></i>
        <span class="win__url">leaklocatorseastcoast.com</span></div>
      <img class="win__shot" src="shots/llec.jpg" alt="">
    </div>
    <div class="win win--c">
      <div class="win__bar"><i class="win__dot"></i><i class="win__dot"></i><i class="win__dot"></i>
        <span class="win__url">morrow.coffee</span></div>
      <img class="win__shot" src="shots/morrow.jpg" alt="">
    </div>
  </div>


</div>
</body>
</html>
