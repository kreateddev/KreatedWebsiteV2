<!-- ==========================================================================
     SLIDE 05 — MOBILE-FIRST DESIGNS
     The same three builds as the cover, on the screen most of their visitors
     actually use.

     ALL THREE CAPTURES ARE THE SAME FRAME: 390x812 logical at 2x DPR, which
     is 780x1624. The two client shots are the ones the Kreated site already
     ships; Morrow was captured to match, from the build in this repo, with a
     real mobile context (is_mobile, touch, iPhone UA) so its own mobile
     recomposition ran rather than a narrow desktop layout.
     🚫 Do not swap in a capture at a different frame. Three phones at three
     scales is the single thing that would make this slide look assembled, and
     it is invisible until you put them side by side.

     The row is FLAT and the three phones are the SAME SIZE. Every other slide
     in this set stacks, overlaps or fans its proof; this one does not, because
     the argument here is that all three got the same treatment. An arc or a
     hero phone in the middle would say one of them mattered more.
     🚫 No notch. Each screen starts at the page, not at a status bar, so the
     pill lands on top of a logo and reads as damage.

     What the two client captures happen to show, and the reason the fact line
     can say what it says: both keep their call and estimate actions pinned at
     the foot of the phone instead of folding them into a menu. That is a
     design decision recorded in work/rare-raleigh-restoration, not a claim
     invented for an ad.
     ========================================================================== -->

</style>
</head>
