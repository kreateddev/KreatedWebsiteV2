<!-- ==========================================================================
     SLIDE 03 — LOCAL SEO
     Leak Locators East Coast, desktop and phone. Both are real captures from
     the live site, retaken on 2026-09-11 when the visual overhaul shipped.

     ⚠ THE SERVICE-AREA PAGE IS NOT SHOWN, AND IT SHOULD BE. The slide was
     specified as "LLEC hero and the locations page". No capture of a location
     page exists anywhere in this repository, and the live site could not be
     re-shot — this session's egress policy answers 403 to CONNECT for
     leaklocatorseastcoast.com. So the service-area work is carried as the
     counted fact instead of a screenshot: two sites, 28 service-area pages,
     from the dated record in work/leak-locators-east-coast.
     🚫 Do not fill the gap by mocking up a location page. It would be a
     picture of a client's site that the client does not have.
     When a capture exists, drop it in as `.sl-loc` — the slot is written
     below, commented out, with geometry that already clears the phone.

     🚫 NOTHING ON THIS SLIDE MAY BE A PERFORMANCE CLAIM. The case study
     forbids crediting any change in the search figures to any piece of work,
     because the measurement window spans the old site, the rebuild and a
     two-state split. A page count is a count of pages. Keep it that way.
     ========================================================================== -->
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="layout-slide.css">
<style>
  .sl-say{top:196px}
  .sl-title{font-size:96px}
  .sl-fact{top:330px}

  /* the desktop runs off the right edge; the phone sits in front of it at the
     left, on the same margin the foot text uses. The pair reads as one site
     at two widths, which is the whole of what local SEO has to land on. */
  .sl-desk{position:absolute;width:780px;left:310px;top:4px;z-index:1}
  .sl-phone{position:absolute;width:250px;height:510px;left:80px;top:0;z-index:2}
  .sl-phone .phone__shot{width:240px}
  /* 🚫 No notch on this one. The capture starts at the page, not at a status
     bar, so the pill lands on top of the client's logo and reads as damage. */
  .sl-phone .phone__notch{display:none}

  .sl-floor{top:414px;left:60px;width:820px}
</style>
</head>

<div class="canvas canvas--1x1">
