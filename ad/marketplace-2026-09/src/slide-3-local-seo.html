<!-- ==========================================================================
     SLIDE 03 — LOCAL SEO
     The homepage and the service-area register, both real captures of the
     live design.

     HOW THE SERVICE-AREA CAPTURE WAS TAKEN, because it is not a viewport shot
     of a URL and the difference matters. The live site is refused by this
     session's egress policy, so the page was rendered from its own source:
     kreateddev/LLEC at 4b293f1, `npm install && next build && next start`,
     then screenshotted at 1600x1000 / 2x DPR. That repository IS the live
     site — its HeroLx component carries "Find the leak before it costs you
     more.", the same words in the live capture the Kreated site ships — so
     this is the current design, not a reconstruction of it.
     ⚠ The root-level .html files in that repo are the LEGACY build and are
     NOT what production serves. 🚫 Do not capture from them.

     The frame is scrolled to y=800 rather than to the top. The route's own
     hero is an ink panel with no photograph, which looks like any other hero
     at slide scale; the register underneath it is the thing that says "local
     SEO" without a word of explanation. The whole register is in frame —
     fourteen coastal towns, each with its county. Nothing is cropped out of
     the list.

     🚫 NOTHING ON THIS SLIDE MAY BE A PERFORMANCE CLAIM. The case study
     forbids crediting any change in the search figures to any piece of work,
     because the measurement window spans the old site, the rebuild and a
     two-state split. A page count is a count of pages.
     🚫 And do not count the towns in the screenshot and put that number on
     the slide. The register lists coverage; an area only becomes a page when
     it clears the substance bar in that repo's lib/areas.ts. The counted
     figure in the fact line comes from the dated record, not from the image.
     ========================================================================== -->
