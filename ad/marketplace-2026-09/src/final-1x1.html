<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kreated — Facebook Marketplace creative, 1080x1080</title>
<!-- ==========================================================================
     THE PRIMARY MARKETPLACE CREATIVE — 1:1, 1080x1080
     This is the listing thumbnail, so it is the only file where the vertical
     rhythm is tuned against a 172px render rather than against the full-size
     one. Copy and screenshots live in ad.config.js; the composition lives in
     layout-campaign.css; only the vertical positions are set below.
     ========================================================================== -->
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="layout-campaign.css">
<style>
  .ad-glow{top:250px;height:900px}
  .ad-head{top:58px}
  .ad-say{top:146px}
  .ad-headline{font-size:86px}
  .ad-sub{top:330px;font-size:25px}
  .ad-fan{top:398px;height:520px}
  .ad-floor{top:770px}
  .ad-services{top:872px}
  .ad-foot{bottom:62px}
  .ad-price__v{font-size:52px}
</style>
</head>
<body>
<div class="canvas canvas--1x1">
  <div class="ad-glow"></div>

  <div class="ad-head">
    <div class="rule"></div>
    <div class="mark ad-mark"></div>
    <div class="rule"></div>
  </div>

  <div class="ad-say"><h1 class="headline ad-headline"></h1></div>
  <p class="ad-sub"></p>

  <div class="ad-floor"></div>
  <div class="ad-fan"></div>

  <p class="ad-services"></p>

  <div class="ad-foot">
    <div class="rule"></div>
    <div class="ad-foot__row">
      <div class="ad-price">
        <div class="ad-price__k"></div>
        <div class="ad-price__v"></div>
      </div>
      <div class="cta"><span class="ad-cta__t"></span><span class="cta__arrow">&#8594;</span></div>
    </div>
  </div>
</div>
<script src="ad.config.js"></script>
<script src="ad.js"></script>
</body>
</html>
